name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # GitHub dependency review needs Dependency graph + GitHub Advanced Security on this
      # internal repository. Until the owner enables them and sets the repository variable
      # DEPENDENCY_REVIEW_ENABLED=true, vulnerable NuGet/npm dependencies are rejected by the
      # supply-chain job in dotnet.yml, which runs on every push and pull request.
      - name: Reject vulnerable dependency changes
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          comment-summary-in-pr: never
      - name: Dependency review not enabled on this repository
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        run: echo "::notice title=Dependency review skipped::GitHub dependency review requires Dependency graph and GitHub Advanced Security. Vulnerable NuGet/npm dependencies are still rejected by the supply-chain job in dotnet.yml. Set repository variable DEPENDENCY_REVIEW_ENABLED=true once enabled."
