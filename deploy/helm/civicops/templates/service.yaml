apiVersion: v1
kind: Service
metadata:
  name: {{ include "civicops.fullname" . }}
  labels:
    {{- include "civicops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
  selector:
    {{- include "civicops.selectorLabels" . | nindent 4 }}
