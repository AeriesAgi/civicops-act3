{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-vllm
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    civicops.io/component: vllm
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, civicops.io/component: vllm}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, civicops.io/component: vllm}
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        {{- toYaml .Values.vllm.nodeSelector | nindent 8 }}
      {{- with .Values.vllm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
        {{- with .Values.vllm.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      containers:
        - name: vllm
          image: {{ .Values.vllm.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          args:
            - --model
            - {{ .Values.vllm.model | quote }}
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --tensor-parallel-size
            - {{ .Values.vllm.tensorParallelSize | quote }}
            - --max-model-len
            - {{ .Values.vllm.maxModelLength | quote }}
            - --gpu-memory-utilization
            - "0.85"
            - --disable-log-requests
          env:
            - {name: VLLM_NO_USAGE_STATS, value: "1"}
            - {name: HOME, value: /cache}
            - {name: HF_HOME, value: /cache/huggingface}
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ .Values.vllm.existingSecret }}, key: CIVICOPS_LLM_API_KEY}
          ports: [{name: http, containerPort: 8000}]
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              {{- toYaml .Values.vllm.resources.requests | nindent 14 }}
              amd.com/gpu: {{ .Values.vllm.gpuCount }}
            limits:
              {{- toYaml .Values.vllm.resources.limits | nindent 14 }}
              amd.com/gpu: {{ .Values.vllm.gpuCount }}
          volumeMounts:
            - {name: models, mountPath: /cache}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: {{ .Values.vllm.modelCacheClaim }}}
        - name: tmp
          emptyDir: {sizeLimit: 4Gi}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, civicops.io/component: vllm}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-vllm
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, civicops.io/component: vllm}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "civicops.selectorLabels" . | nindent 14 }}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if .Values.networkPolicy.httpsEgressCIDRs }}
    - to:
        {{- range .Values.networkPolicy.httpsEgressCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}
