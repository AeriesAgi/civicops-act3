{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "civicops.fullname" . }}
  labels:
    {{- include "civicops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "civicops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.databaseNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.databasePodLabels | nindent 14 }}
        {{- range .Values.networkPolicy.databaseCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.telemetryNamespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.telemetryPodLabels | nindent 14 }}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
    {{- if .Values.vllm.enabled }}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, civicops.io/component: vllm}
      ports: [{protocol: TCP, port: 8000}]
    {{- end }}
    {{- if .Values.networkPolicy.httpsEgressCIDRs }}
    - to:
        {{- range .Values.networkPolicy.httpsEgressCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports: [{protocol: TCP, port: 443}]
    {{- end }}
{{- end }}
